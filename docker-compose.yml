services:
  db:
    image: postgres:16-alpine
    container_name: turnero-db
    restart: unless-stopped
    environment:
      # Usuario administrador de Postgres (dueño de las tablas). No usar
      # DB_USER acá: turnero_app lo crea docs/roles.sql y chocaría.
      POSTGRES_USER: ${POSTGRES_USER:-turnero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turnero}
      POSTGRES_DB: ${DB_NAME:-turnero}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - turnero_pgdata:/var/lib/postgresql/data
      # Postgres corre todo lo que encuentra acá en orden alfabético, pero
      # SOLO la primera vez que se crea el volumen (si ya existen datos,
      # se ignora; para forzar una recarga hay que "docker compose down -v").
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-turnero} -d ${DB_NAME:-turnero}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  turnero_pgdata:
